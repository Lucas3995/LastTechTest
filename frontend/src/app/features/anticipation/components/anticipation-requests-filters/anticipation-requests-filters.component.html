<form class="filters" (submit)="$event.preventDefault(); onApply(statusSelect)" novalidate>
  <label class="filters__field">
    <span>Status</span>
    <select
      #statusSelect
      data-testid="filter-status"
      [value]="selectedStatus"
      (change)="selectedStatus = $any($event.target).value"
    >
      @for (opt of statusOptions; track opt.value) {
        <option [value]="opt.value" [selected]="opt.value === selectedStatus">{{ opt.label }}</option>
      }
    </select>
  </label>

  <button type="submit">
    Aplicar filtros
  </button>
</form>
