<section class="admin-reset-dialog">
  <h2 mat-dialog-title>Resetar Senha - Confirmação</h2>

  <mat-dialog-content>
    <p>Confirma o reset de senha deste usuário?</p>
    @if (data.email) {
      <p><strong>{{ data.email }}</strong></p>
    }
    <p>Nova senha temporária: <strong>Trocar@123</strong></p>
  </mat-dialog-content>

  <mat-dialog-actions align="end">
    <button type="button" mat-button (click)="onCancel()">Cancelar</button>
    <button type="button" mat-raised-button color="warn" (click)="onConfirm()">Confirmar</button>
  </mat-dialog-actions>
</section>
