<div class="shell">
  <header class="shell__header">
    <span class="shell__brand">LastTechTest</span>
    @if (authService.isAuthenticated()) {
      <nav class="shell__nav" aria-label="Main navigation">
        @for (item of navItems(); track item.path) {
          <a
            [routerLink]="item.path"
            routerLinkActive="shell__link--active"
            [routerLinkActiveOptions]="item.path === '/home' ? { exact: true } : { exact: false }"
            ariaCurrentWhenActive="page"
            class="shell__link"
            >{{ item.label }}</a
          >
        }
      </nav>
    } @else {
      <a routerLink="/" class="shell__link">Entrar</a>
    }
  </header>
  <main id="main-content" class="shell__main" tabindex="-1">
    <router-outlet />
  </main>
  <footer class="shell__footer" role="contentinfo">
    <small>LastTechTest — base frontend</small>
  </footer>
</div>
