# Serves only the SPA. API/auth requests are made by the browser directly
# to the backend (e.g. http://localhost:5114) so they appear in the Network tab.
server {
  listen 4200;
  server_name localhost;
  root /app/dist;
  index index.html;
  location / {
    try_files $uri $uri/ /index.html;
  }
}
