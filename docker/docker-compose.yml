version: "3.9"

services:
  api:
    build:
      context: ..
      dockerfile: backend/LastTechTest.API/Dockerfile
    ports:
      - "5114:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Data Source=/data/lasttechtest.db
      - Jwt__Secret=change-me-in-production-super-secret-key
      - Jwt__Issuer=LastTechTest
      - Jwt__Audience=LastTechTest-Users
    volumes:
      - lasttechtest-data:/data

volumes:
  lasttechtest-data:

